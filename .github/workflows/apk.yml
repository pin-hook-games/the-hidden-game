name: Costruisci APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Chiave di firma
        id: key
        env: { KEYSTORE_BASE64: "${{ secrets.KEYSTORE_BASE64 }}" }
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::Mancano i secrets della chiave: APK non costruito."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.key.outputs.ok == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - if: steps.key.outputs.ok == 'true'
        run: cp android/app/build/outputs/apk/release/app-release.apk the-hidden-game.apk
      - name: Pubblica (link fisso)
        if: steps.key.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: The Hidden Game · APK Android
          body: "Scarica the-hidden-game.apk e aprilo sul telefono Android. Build n. ${{ github.run_number }}."
          files: the-hidden-game.apk
          make_latest: true
