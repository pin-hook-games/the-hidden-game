<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hidden Game</title>
<meta name="description" content="The Hidden Game · un gioco investigativo di Pin&Hook Games">
<meta name="theme-color" content="#0f1a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hidden Game">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: la scrivania di un'agenzia investigativa. Prima l'elenco degli incarichi (episodi),
   poi il telefono affidato dal cliente con fascicolo e rapporto. Sotto i 900px: schede a tutto schermo. */
:root{
  color-scheme: dark;
  --desk:#0f1a2b;       /* piano della scrivania, blu notte */
  --desk-2:#1d3150;
  --paper:#f3efe9;      /* carta dei fascicoli e superfici delle app */
  --ink:#231a1e;
  --ink-soft:#6b5d62;
  --tag:#f0a63a;        /* linguetta ambra: prove */
  --heart:#d43d55;      /* rosso: verdetto */
  --me:#33658a;         /* messaggi inviati dal proprietario del telefono */
  --line:#ddd5cc;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(circle at 80% 0%,var(--desk-2),transparent 55%)}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
button:focus-visible,select:focus-visible{outline:3px solid var(--tag);outline-offset:2px}

/* ---------- elenco episodi ---------- */
.menu{height:100%;overflow-y:auto;padding:28px 16px 40px}
.menu-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{font-family:var(--display);font-weight:800;font-size:clamp(40px,11vw,68px);line-height:.95;letter-spacing:-1.5px;margin:0;text-wrap:balance}
.brand span{color:var(--heart)}
.lead{margin:0;max-width:52ch;color:#d9e2ee}
.eps{display:flex;flex-direction:column;gap:8px}
.ep{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--paper);color:var(--ink);border-radius:8px;padding:12px 14px;width:100%}
.ep .n{font-family:var(--mono);font-size:13px;color:var(--ink-soft)}
.ep b{display:block;font-weight:600}
.ep small{font-size:13px;color:var(--ink-soft)}
.ep .st{font-family:var(--mono);font-size:12px;white-space:nowrap}
.ep.cur{outline:2px solid var(--tag);outline-offset:-2px}
.ep .th{position:relative;width:76px;height:57px;border-radius:8px;overflow:hidden;background:#222;flex:none;display:block}
.ep .th svg,.ep .th img{width:100%;height:100%;display:block;object-fit:cover}
.ep .th .n{position:absolute;left:4px;bottom:3px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.ep:not(.cat){grid-template-columns:76px 1fr auto}
.ep:disabled .th{filter:grayscale(1)}
body{transition:background-color .4s}
.ep.cat{padding:16px 14px;align-items:start}
.ep.cat b{font-family:var(--display);font-size:20px;letter-spacing:-.3px}
.ep.cat small{display:block;margin-top:3px}
.ep.cat .cprog{font-family:var(--mono);font-size:12px;margin-top:8px}
.ep.cat .st{align-self:end}
.ep.cat{position:relative;overflow:hidden;min-height:240px;align-items:end;background:#111;color:#fff;border-radius:14px;padding:18px 16px}
.ep.cat .cover{position:absolute;inset:0;z-index:0}
.ep.cat .cover svg,.ep.cat .cover img{width:100%;height:100%;object-fit:cover;display:block}
.ep.cat::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.88) 80%)}
.ep.cat>span:not(.cover){position:relative;z-index:2}
.ep.cat .n,.ep.cat small,.ep.cat .st{color:rgba(255,255,255,.88)}
.ep.cat .cprog{color:#ffd27a}
.ep:disabled{opacity:.55}
.link.back{align-self:flex-start;color:#d9e2ee;font-size:14px;padding:4px 0}
.ep.cur .st{color:#9a5a00;font-weight:700}
.saves{margin-top:6px;padding:14px 16px;border:1px dashed rgba(255,255,255,.35);border-radius:8px;color:#d9e2ee;font-size:14px;display:flex;flex-direction:column;gap:8px}
.saves p{margin:0}.saves .meta{font-family:var(--mono);font-size:12px;color:#cdbfc4}
.saves .code{font-family:var(--mono);font-size:17px;letter-spacing:.08em;color:var(--tag);user-select:all;-webkit-user-select:all}
.saves small{color:#cdbfc4}
.coderow{display:flex;gap:8px}
.coderow input{flex:1;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.25);color:#fff;font-family:var(--mono);font-size:16px;text-transform:uppercase}
.coderow .btn{border-color:#fff;color:#fff;background:transparent}
.link.restart{display:block;margin-top:4px;font-size:13px;opacity:.75}
.ring{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:space-between;padding:64px 22px 34px;color:#fff;background:linear-gradient(170deg,#1d2b3a,#0d1117 60%,#231019)}
.ring[hidden]{display:none}
.ring-top{text-align:center;display:flex;flex-direction:column;gap:8px}
.ring-top small{font-size:14px;color:#b9c4cf}
.ring-top b{font-size:30px;font-weight:600;letter-spacing:-.4px;overflow-wrap:anywhere}
.ring.shake .ring-top b{animation:ringshake 1.1s infinite}
@keyframes ringshake{0%,60%,100%{transform:none}10%,30%,50%{transform:translateX(-3px) rotate(-1deg)}20%,40%{transform:translateX(3px) rotate(1deg)}}
.ring-text{flex:1;overflow-y:auto;margin:22px 0;display:flex;flex-direction:column;gap:10px;justify-content:center}
.ring-text p{margin:0;background:rgba(255,255,255,.1);border-radius:14px;padding:11px 14px;font-size:16px;line-height:1.35}
.ring-btns{display:flex;justify-content:space-around;gap:16px}
.rb{min-width:112px;text-align:center;padding:15px 18px;border-radius:99px;font-weight:700;font-size:16px;color:#fff}
.rb.no{background:#e5484d}.rb.yes{background:#30a46c}
.banner{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:30;width:min(430px,calc(100% - 20px));text-align:left;background:rgba(28,28,32,.96);color:#fff;border-radius:16px;padding:10px 14px;display:grid;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:bandrop .3s ease-out}
.banner[hidden],body[data-screen="menu"] .banner{display:none}
.banner i{font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#30a46c;font-weight:700}
.banner b{font-size:15px}.banner span{font-size:14px;color:#d6d6dc;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@keyframes bandrop{from{transform:translate(-50%,-120%)}to{transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.ring.shake .ring-top b,.banner{animation:none}}
.mutebtn{color:#d9e2ee;font-size:13px;text-align:left}
.ep.open{box-shadow:inset 6px 0 0 var(--heart)}
.ep.open .st{color:var(--heart);font-weight:600}
.ep[disabled]{opacity:.55;cursor:not-allowed}
.stamp{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.menu .stamp{color:#c9b3ba}

/* ---------- gioco ---------- */
.stage{height:100%;display:flex;gap:28px;align-items:center;justify-content:center;padding:16px}
body[data-screen="menu"] .stage,body[data-screen="menu"] .tabs,body[data-screen="game"] .menu{display:none}
.phone{width:min(390px,100%);height:min(820px,100%);background:#0f0b0d;border-radius:38px;padding:10px;box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 2px #3a2b31;flex:none;position:relative}
.screen{height:100%;border-radius:29px;overflow:hidden;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;position:relative}
.status{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-family:var(--mono);font-size:12px;background:#0f0b0d;color:#d9ccd0;flex:none}
.view{flex:1;overflow-y:auto;min-height:0}
.home{min-height:100%;padding:24px 20px;background:linear-gradient(165deg,#33658a 0%,#5b4a7a 55%,#8a3f5c 100%);color:#fff;display:flex;flex-direction:column;gap:18px}
.clock{font-family:var(--display);font-weight:800;font-size:60px;line-height:1;letter-spacing:-2px}
.date{font-family:var(--mono);font-size:13px;opacity:.9}
.owner{font-size:13px;background:rgba(0,0,0,.35);padding:8px 12px;border-radius:12px;align-self:flex-start}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;margin-top:auto}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:12px;text-align:center}
.app i{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:25px;background:rgba(255,255,255,.92);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.app:active i{transform:scale(.94)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:2}
.bar h2{font-family:var(--display);font-size:20px;margin:0;font-weight:800}
.back{font-family:var(--mono);font-size:13px;color:var(--me);padding:4px 6px}
.list{display:flex;flex-direction:column}
.grp{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:14px 16px 6px}
.row{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff;width:100%}
.row b{font-weight:600}
.row small,.meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
.row span{color:var(--ink-soft);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.flag{box-shadow:inset 5px 0 0 var(--tag)}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.pad p{margin:0}
.chat{padding:14px;display:flex;flex-direction:column;gap:8px}
.row.still{cursor:default}
.qbox{background:#fff;border:1px solid var(--line);border-left:6px solid var(--heart);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.qbox .qn{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--heart)}
.qbox .qt{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.15;margin:0;text-wrap:balance}
.qbox input,.qbox select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}
.news{background:var(--ink);color:#fff;border-radius:6px;padding:10px 12px;font-size:13.5px}
.news b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tag);margin-bottom:2px}
.bub.rec{border-style:dashed;border-color:var(--tag)}
.fb{font-size:13.5px;min-height:1.4em}
.fb.bad{color:var(--heart);font-weight:600}
.fb.tip{color:var(--me)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--heart);width:0;transition:width .3s}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.log li{padding:7px 10px;border-left:4px solid var(--tag);background:#fff}
.log li b{display:block;font-weight:600}
.log li.empty{border-left-color:var(--line);color:var(--ink-soft)}
.lockbtn{margin:4px 12px 12px;padding:14px;border-radius:12px;background:#fff;border:1px dashed var(--ink-soft);text-align:center;font-weight:600;width:calc(100% - 24px)}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--me);color:#fff;border-color:var(--me)}
.bub small{display:block;font-family:var(--mono);font-size:10.5px;opacity:.7;margin-top:3px}
.sys{align-self:center;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);padding:4px 0}
.flag{box-shadow:0 0 0 3px var(--tag)}
.shot{border-radius:12px;overflow:hidden;position:relative;display:block;width:100%;background:#222}
.shot svg{display:block;width:100%;height:auto}
.shot em{position:absolute;right:8px;bottom:6px;font-family:var(--mono);font-style:normal;font-size:12px;color:#ffd9a0;text-shadow:0 1px 2px #000}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 12px 12px}
.mapbox{border-bottom:1px solid var(--line)}
.mapbox svg{display:block;width:100%;height:auto}
.mapwrap{position:relative}
.spot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:0;padding:0;background:transparent;cursor:pointer}
.spot i{display:flex;align-items:center;justify-content:center;width:22px;height:22px;margin:4px;border-radius:50%;background:#fff;color:#0a84ff;font-style:normal;font-weight:800;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 2px #0a84ff inset}
.spot.lk i{color:#555;box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 2px #8e8e93 inset;font-size:10px}
.spot.on i{background:#0a84ff;color:#fff}
.spot em{position:absolute;left:27px;top:8px;white-space:nowrap;font-size:9.5px;font-weight:600;font-style:normal;color:#1d1d1f;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff;pointer-events:none}
.spotcard{margin:10px 12px 0;padding:12px 14px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.spotcard p{margin:6px 0 0;white-space:pre-line}
.spotcard .shot{margin-top:8px}
.spotcard .pin{padding:14px 0 4px}
.maptip{margin:8px 14px 0;font-size:12.5px;color:#8e8e93}
.lhint{margin:0;max-width:280px;font-size:13px;color:#3a3a3c;background:#f2f2f7;border-radius:10px;padding:8px 12px;font-style:italic}
.lhint span{display:block;font-style:normal;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#8e8e93;margin-bottom:2px}
.mark{background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;text-align:center;font-weight:600}
.mark.done{background:var(--tag);color:#2a1a03}
.pin{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px;text-align:center}
.dots{font-family:var(--mono);font-size:30px;letter-spacing:10px;min-height:38px}
.keys{display:grid;grid-template-columns:repeat(3,64px);gap:10px}
.keys button{height:54px;border-radius:14px;background:#fff;border:1px solid var(--line);text-align:center;font-family:var(--mono);font-size:20px}
.toast{position:absolute;left:14px;right:14px;bottom:16px;background:var(--ink);color:#fff;padding:11px 14px;border-radius:12px;font-size:13.5px;transform:translateY(140%);transition:transform .25s;z-index:5}
.toast{opacity:0;visibility:hidden}
.toast.on{transform:none;opacity:1;visibility:visible}

.side{width:min(430px,100%);max-height:min(820px,100%);overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding-top:8px}
.file{background:var(--paper);color:var(--ink);border-radius:6px;padding:22px 22px 24px;box-shadow:0 20px 40px rgba(0,0,0,.35);position:relative;display:flex;flex-direction:column;gap:12px}
.file::before{content:"";position:absolute;top:-8px;left:28px;width:96px;height:18px;background:var(--tag);border-radius:3px 3px 0 0}
.file.report::before{background:var(--heart)}
.file h1{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.05;margin:0;text-wrap:balance}
.file p{margin:0}
.file h3{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:6px 0 0;color:var(--ink-soft)}
.quote{border-left:4px solid var(--heart);padding:8px 12px;background:#fff;font-style:italic}
.ev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.ev li{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-left:4px solid var(--tag);background:#fff}
.ev li span{flex:1;min-width:0;overflow-wrap:anywhere}
.ev li button{font-family:var(--mono);font-size:12px;color:var(--heart);flex:none;padding:0 4px}
.ev li.empty{border-left-color:var(--line);color:var(--ink-soft)}
.hints{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.hints li{padding:8px 10px;background:#fff;border-left:4px solid var(--me)}
.q{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600}
.q select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-weight:400}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:11px 14px;border-radius:8px;font-weight:600;text-align:center;border:1px solid var(--ink)}
.btn.solid{background:var(--ink);color:#fff}
.btn.red{background:var(--heart);border-color:var(--heart);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{font-family:var(--mono);font-size:13px;color:var(--me);align-self:flex-start}
.tabs{display:none}
.timer{position:fixed;top:10px;right:14px;z-index:25;background:#0f0b0d;color:var(--tag);font-family:var(--mono);font-weight:600;font-size:13px;padding:5px 10px;border-radius:99px;border:1px solid #3a2b31;font-variant-numeric:tabular-nums}
.timer.low{background:var(--heart);color:#fff;border-color:var(--heart)}
.timer[hidden],body[data-screen="menu"] .timer{display:none}
.verdict{position:fixed;inset:0;background:rgba(20,9,14,.88);display:none;place-items:center;padding:16px;z-index:30}
.verdict.on{display:grid}
.card{background:var(--paper);color:var(--ink);max-width:500px;width:100%;border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow-y:auto}
.card h2{font-family:var(--display);font-weight:800;font-size:29px;line-height:1.05;margin:0;text-wrap:balance}
.card p{margin:0}
.stars{font-size:30px;letter-spacing:4px;color:var(--tag)}
.card ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* ---------- aspetto da telefono moderno: icone a tessera, liste raggruppate, bolle piene ---------- */
.screen{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,"Segoe UI",sans-serif;background:#f2f2f7}
.status{background:transparent;color:var(--ink);font-family:inherit;font-weight:600;font-size:13px;padding:10px 22px 6px;position:relative;z-index:3}
.status::after{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:92px;height:24px;border-radius:99px;background:#0b0b0d}
.status span:nth-child(2){visibility:hidden}
.screen[data-home="1"] .status{color:#fff;position:absolute;left:0;right:0;top:0}
.home{padding:64px 18px 22px;background:radial-gradient(circle at 20% 15%,#6fa8dc 0%,transparent 45%),radial-gradient(circle at 85% 80%,#c0577f 0%,transparent 50%),linear-gradient(160deg,#243b6b,#3b2f63 60%,#5a2a4a);gap:14px}
.clock{font-family:inherit;font-weight:300;font-size:74px;letter-spacing:-3px;text-align:center}
.date{font-family:inherit;font-size:15px;text-align:center;opacity:.95}
.home>div:first-child{display:flex;flex-direction:column-reverse;gap:2px}
.owner{align-self:center;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border-radius:99px;font-size:12.5px;padding:6px 14px}
.apps{grid-template-columns:repeat(4,1fr);gap:18px 6px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);padding:16px 10px;border-radius:26px}
.app{font-size:11px;gap:5px}
.app i{width:54px;height:54px;border-radius:14px;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.35)}
.bar{background:rgba(249,249,251,.94);backdrop-filter:blur(10px);border-bottom:1px solid #d9d9de;padding:10px 12px;display:grid;grid-template-columns:1fr auto 1fr}
.bar h2{font-family:inherit;font-weight:600;font-size:16px;grid-column:2;text-align:center}
.back{font-family:inherit;font-size:15px;color:#2f7df6;justify-self:start;grid-column:1;grid-row:1}
.grp{font-family:inherit;font-size:12px;letter-spacing:.02em;color:#6d6d72;padding:18px 28px 6px}

<script src="engine.js"></script>
<div id="upd" style="display:none;position:fixed;left:12px;right:12px;bottom:16px;z-index:9999;background:#f2be3c;color:#0f1a2b;border-radius:14px;padding:14px 16px;font:600 15px/1.3 system-ui,sans-serif;box-shadow:0 8px 30px #0008;text-align:center;cursor:pointer">Nuova versione disponibile · tocca per aggiornare</div>
<script>
if("serviceWorker" in navigator){
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!reloading){reloading=true;location.reload();}});
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const show=w=>{const b=document.getElementById("upd");b.style.display="block";b.onclick=()=>w.postMessage("skip");};
    if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
    reg.addEventListener("updatefound",()=>{const w=reg.installing;w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)show(w);});});
    setInterval(()=>reg.update(),30*60*1000);
  });
}
</script>
</body>
</html>
