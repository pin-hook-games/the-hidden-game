plugins { id "com.android.application" }

// Numero di versione: lo imposta GitHub a ogni build (run number), così ogni APK si installa sopra il precedente.
def buildNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace "com.pinhookgames.hiddengame"
    compileSdk 34
    defaultConfig {
        applicationId "com.pinhookgames.hiddengame"
        minSdk 24
        targetSdk 34
        versionCode buildNo
        versionName "1.0." + buildNo
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
